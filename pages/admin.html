<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09070e" />
    <title>Admin Panel — Suvarna Cinefusion</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css?v=3" />
    <link rel="stylesheet" href="../css/subpage.css" />
    <style>
      .admin-layout { min-height: calc(100vh - 180px); display: flex; flex-direction: column; padding: 120px 20px 40px; width: 100%; max-width: 1400px; margin: 0 auto; }
      .admin-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); text-align: center; margin: auto; }
      .admin-box h2 { font-size: 32px; margin-top: 0; margin-bottom: 25px; }
      .admin-box h2 em { font-family: var(--serif); color: var(--lime); font-style: normal; }
      
      .form-group { margin-bottom: 20px; text-align: left; }
      .form-group label { display: block; font: 11px 'DM Mono'; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 8px; text-transform: uppercase; }
      .form-group input, .form-group textarea, .form-group select { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--line); color: #ffffff; padding: 12px 15px; border-radius: 8px; outline: none; transition: border-color 0.2s, background 0.2s; font-family: inherit; font-size: 15px; font-weight: 500; }
      .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--lime); background: rgba(0,0,0,0.4); }
      .form-group input::placeholder, .form-group textarea::placeholder { color: rgba(255,255,255,0.3); }
      .form-group textarea { resize: vertical; min-height: 80px; }
      .form-group select option { background-color: #1a1522; color: #ffffff; }
      
      /* Fix for browser autofill background */
      .form-group input:-webkit-autofill,
      .form-group input:-webkit-autofill:hover, 
      .form-group input:-webkit-autofill:focus, 
      .form-group input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px #1a1522 inset !important;
          -webkit-text-fill-color: white !important;
          transition: background-color 5000s ease-in-out 0s;
      }
      
      .password-wrapper { position: relative; }
      .password-wrapper input { padding-right: 40px; }
      .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--muted); padding: 5px; cursor: pointer; display: grid; place-items: center; transition: color 0.2s; z-index: 5; }
      .toggle-password:hover { color: #ffffff; }
      
      .auth-message { font-size: 12px; margin-bottom: 20px; color: #ff5f5f; display: none; }
      .auth-message.success { color: var(--lime); }
      
      #dashboardSection { display: none; width: 100%; }
      .dashboard-container { background: rgba(15, 12, 23, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 40px; width: 100%; box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); text-align: left; }
      .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
      .dashboard-header h2 { font-size: 32px; margin: 0; }
      .dashboard-header h2 em { font-family: var(--serif); color: var(--lime); font-style: normal; }
      .logout-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; transition: 0.2s; cursor: pointer; }
      .logout-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); border-color: var(--text); }
      
      .tabs { display: flex; gap: 15px; margin-bottom: 35px; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .tab-btn { background: transparent; border: none; color: var(--muted); padding: 12px 24px; cursor: pointer; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.3s ease; position: relative; }
      .tab-btn:hover { color: #fff; }
      .tab-btn.active { color: var(--lime); border-bottom-color: var(--lime); }
      .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: var(--lime); box-shadow: 0 0 10px var(--lime); }
      .tab-content { display: none; text-align: left; }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .tab-content.active { display: block; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; padding: 5px; }
      .order-grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; padding: 5px; }
      
      .grid-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); padding: 25px; border-radius: 16px; display: flex; flex-direction: column; height: 100%; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
      .grid-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
      .grid-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
      .grid-card:hover::before { opacity: 1; }
      
      .dashboard-form { max-width: 640px; margin: 0 auto; background: rgba(255,255,255,0.015); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.06); box-shadow: inset 0 0 40px rgba(0,0,0,0.2); }
      
      input[type="file"] { background: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.2); cursor: pointer; padding: 20px !important; text-align: center; color: var(--muted); transition: all 0.3s ease; }
      input[type="file"]:hover { border-color: var(--lime); background: rgba(206, 255, 26, 0.05); color: #fff; }

      .full-width { width: 100%; margin-top: 10px; }
    </style>
  </head>
  <body class="inner-page">
    <script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light');</script>
    <div class="site-noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand brand-wide" href="../index.html" aria-label="Suvarna Cinefusion home"><span class="brand-mark">S</span><span>Suvarna <span class="brand-dot">Cinefusion</span></span></a>
      <nav class="desktop-nav" aria-label="Main navigation"><a href="portfolio.html">Portfolio</a><a href="services.html">Services</a><a href="about.html">About</a></nav>
      <div class="header-actions"><button class="theme-button" id="themeButton" type="button" aria-label="Toggle color theme"><span>◐</span></button><button class="mobile-menu-btn" aria-label="Open mobile menu">☰</button></div>
    </header>
    
    <main class="page-main admin-layout">
      <!-- Login Section -->
      <div class="admin-box" id="loginSection">
        <h2>Admin <em>Panel</em></h2>
        <div class="auth-message" id="loginMessage"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" required placeholder="Enter password">
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="button button-solid full-width" id="loginBtn">Secure Login <span>→</span></button>
        </form>
      </div>

      <!-- Dashboard Section -->
      <div id="dashboardSection">
        <div class="dashboard-container">
          <div class="dashboard-header">
            <h2>Manage <em>Offers</em></h2>
            <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
          </div>
          
          <div class="tabs" style="flex-wrap: wrap; gap: 10px;">
            <button class="tab-btn active" onclick="switchTab('offersTab', this)">Current Offers</button>
            <button class="tab-btn" onclick="switchTab('ordersTab', this)" id="tabOrdersBtn">Orders</button>
            <button class="tab-btn" onclick="switchTab('addTab', this)" id="tabAddBtn">Add New Offer</button>
            <button class="tab-btn" onclick="switchTab('portfolioListTab', this)" id="tabPortfolioListBtn">Portfolio Items</button>
            <button class="tab-btn" onclick="switchTab('addPortfolioTab', this)" id="tabAddPortfolioBtn">Add Portfolio Item</button>
          </div>

          <div id="offersTab" class="tab-content active">
              <div id="offersList" class="grid-layout" style="max-height: 70vh; overflow-y: auto; padding-right: 10px;">
                  <!-- Loading... -->
              </div>
          </div>

          <div id="ordersTab" class="tab-content">
              <div style="margin-bottom: 20px;">
                  <input type="text" id="orderSearch" placeholder="Search orders by name, email, or txn ID..." style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--line); color: #ffffff; padding: 12px 15px; border-radius: 8px; outline: none; font-size: 14px;">
              </div>
              <div id="ordersList" class="order-grid-layout" style="max-height: 65vh; overflow-y: auto; padding-right: 10px;">
                  <!-- Loading... -->
              </div>
              <div id="ordersPagination" style="display:flex; justify-content:center; gap:10px; margin-top:20px; border-top: 1px solid var(--line); padding-top: 20px;">
                  <!-- Pagination buttons -->
              </div>
          </div>

          <div id="addTab" class="tab-content">
              <div class="dashboard-form">
                <h3 id="formTitle" style="font-size:22px; margin-top:0; border-bottom: 1px solid var(--line); padding-bottom: 15px; margin-bottom: 20px;">Add New Offer</h3>
                <div class="auth-message" id="offerMessage"></div>
                <form id="offerForm" enctype="multipart/form-data">
                  <input type="hidden" id="offerId" name="id">
                  <div class="form-group">
                    <label for="image">Offer Image (Optional for edit)</label>
                    <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp, image/gif" style="padding: 9px 15px;">
                  </div>
                  <div class="form-group">
                    <label for="title">Offer Title</label>
                    <input type="text" id="title" name="title" required placeholder="e.g. Cinema Deck">
                  </div>
                  <div class="form-group">
                    <label for="type">Offer Type</label>
                    <input type="text" id="type" name="type" required placeholder="e.g. PRESENTATION TEMPLATE">
                  </div>
                  <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                      <label for="price_basic">Basic Price</label>
                      <input type="number" step="0.01" id="price_basic" name="price_basic" required placeholder="39.00">
                    </div>
                    <div class="form-group" style="flex:1;">
                      <label for="price_advanced">Adv. Price</label>
                      <input type="number" step="0.01" id="price_advanced" name="price_advanced" required placeholder="69.00">
                    </div>
                    <div class="form-group" style="flex:1;">
                      <label for="price_premium">Premium Price</label>
                      <input type="number" step="0.01" id="price_premium" name="price_premium" required placeholder="99.00">
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" required placeholder="A persuasive 48-slide pitch system..." style="min-height: 120px;"></textarea>
                  </div>
                  <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="button button-solid full-width" id="addOfferBtn" style="flex: 2; margin-top: 0; padding: 15px;">Publish <span>↗</span></button>
                    <button type="button" class="button button-ghost full-width" id="cancelEditBtn" style="display:none; flex: 1; margin-top: 0; padding: 15px;">Cancel</button>
                  </div>
                </form>
              </div>
          </div>

          <div id="portfolioListTab" class="tab-content">
              <div id="portfolioList" class="grid-layout" style="max-height: 70vh; overflow-y: auto; padding-right: 10px;">
                  <!-- Loading... -->
              </div>
          </div>

          <div id="addPortfolioTab" class="tab-content">
              <div class="dashboard-form">
                <h3 style="font-size:22px; margin-top:0; border-bottom: 1px solid var(--line); padding-bottom: 15px; margin-bottom: 20px;">Add New Portfolio Item</h3>
                <div class="auth-message" id="portfolioMessage"></div>
                <form id="portfolioForm" enctype="multipart/form-data">
                  <div class="form-group">
                    <label for="portfolioImage">Cover Image or Video (JPG/PNG/MP4)</label>
                    <input type="file" id="portfolioImage" name="image" accept="image/*,video/*" required style="padding: 9px 15px;">
                  </div>
                  <div class="form-group">
                    <label for="portfolioTitle">Title</label>
                    <input type="text" id="portfolioTitle" name="title" required placeholder="e.g. Aurelia Hotels">
                  </div>
                  <div class="form-group">
                    <label for="portfolioCategory">Category</label>
                    <select id="portfolioCategory" name="category" required>
                      <option value="">Select Category</option>
                      <option value="Wedding Videos">Wedding Videos</option>
                      <option value="YouTube Videos">YouTube Videos</option>
                      <option value="Professional Post-Production">Professional Post-Production</option>
                      <option value="Short-Form Content">Short-Form Content</option>
                      <option value="Corporate & Event Videos">Corporate & Event Videos</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="portfolioYear">Year</label>
                    <input type="text" id="portfolioYear" name="year" required placeholder="e.g. 2026">
                  </div>
                  <div class="form-group">
                    <label for="portfolioDescription">Description</label>
                    <textarea id="portfolioDescription" name="description" required placeholder="Short description..." style="min-height: 80px;"></textarea>
                  </div>
                  <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="button button-solid full-width" id="addPortfolioBtn" style="flex: 2; margin-top: 0; padding: 15px;">Publish <span>↗</span></button>
                  </div>
                </form>
              </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="page-footer"><span>© 2026 SUVARNA CINEFUSION</span><span class="footer-links"><a href="mailto:hello@suvarnacinefusion.com">Email</a><a href="../index.html">Home</a></span></footer>
    <script src="../js/app.js?v=2"></script>
    <script>
      const loginSection = document.getElementById('loginSection');
      const dashboardSection = document.getElementById('dashboardSection');
      const loginForm = document.getElementById('loginForm');
      const offerForm = document.getElementById('offerForm');
      const loginMessage = document.getElementById('loginMessage');
      const offerMessage = document.getElementById('offerMessage');
      const logoutBtn = document.getElementById('logoutBtn');
      const loginBtn = document.getElementById('loginBtn');
      const addOfferBtn = document.getElementById('addOfferBtn');
      const cancelEditBtn = document.getElementById('cancelEditBtn');
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const offersList = document.getElementById('offersList');
      const formTitle = document.getElementById('formTitle');
      const offerIdInput = document.getElementById('offerId');

      const portfolioForm = document.getElementById('portfolioForm');
      const portfolioMessage = document.getElementById('portfolioMessage');
      const addPortfolioBtn = document.getElementById('addPortfolioBtn');
      const portfolioList = document.getElementById('portfolioList');

      let currentOffers = [];
      let currentPortfolio = [];

      // Tab Switching Logic
      window.switchTab = (tabId, btnElement) => {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        // Show selected tab
        document.getElementById(tabId).classList.add('active');
        
        // Update tab buttons
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        // Reset form if switching to add tab without edit mode
        if(tabId === 'addTab' && !offerIdInput.value) {
            cancelEditBtn.click();
        }
      };

      // Toggle Password Visibility
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'text') {
          togglePassword.style.color = '#ffffff';
        } else {
          togglePassword.style.color = 'var(--muted)';
        }
      });

      // Fetch and render offers
      async function loadAdminOffers() {
        offersList.innerHTML = '<span style="color:var(--muted);font-size:12px;">Loading...</span>';
        try {
          const res = await fetch('../api/get_offers.php');
          const data = await res.json();
          if (data.success) {
            currentOffers = data.offers;
            if (currentOffers.length === 0) {
              offersList.innerHTML = '<span style="color:var(--muted);font-size:12px;">No offers available.</span>';
              return;
            }
            offersList.innerHTML = currentOffers.map(offer => `
              <div class="grid-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items: flex-start;">
                  <strong style="color:var(--lime); font-size:18px; font-weight: 700; letter-spacing: -0.01em;">${offer.title}</strong>
                  <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
                    <span style="font: 11px 'DM Mono'; color:var(--muted);">B: $${offer.price_basic}</span>
                    <span style="font: 11px 'DM Mono'; color:var(--muted);">A: $${offer.price_advanced}</span>
                    <span style="font: 12px 'DM Mono'; background: rgba(206, 255, 26, 0.1); border: 1px solid rgba(206, 255, 26, 0.2); color: var(--lime); padding: 2px 6px; border-radius: 4px; font-weight: 500;">P: $${offer.price_premium}</span>
                  </div>
                </div>
                <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 15px; display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; align-self: flex-start;">${offer.type}</div>
                <p style="margin:0 0 24px; font-size:14px; color:rgba(255,255,255,0.6); flex-grow: 1; line-height: 1.6; word-break: break-word; overflow-wrap: break-word;">${offer.description}</p>
                <div style="display:flex; gap:12px; margin-top: auto; position: relative; z-index: 2;">
                  <button onclick="editOffer(${offer.id})" style="flex: 1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px 15px; border-radius:8px; font-size:13px; font-weight: 600; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'; this.style.transform='translateY(-1px)';" onmouseout="this.style.background='rgba(255,255,255,0.05)'; this.style.transform='translateY(0)';">Edit Offer</button>
                  <button onclick="deleteOffer(${offer.id})" style="flex: 1; background:rgba(255, 95, 95, 0.05); border:1px solid rgba(255, 95, 95, 0.2); color:#ff5f5f; padding:10px 15px; border-radius:8px; font-size:13px; font-weight: 600; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(255, 95, 95, 0.15)'; this.style.borderColor='rgba(255, 95, 95, 0.4)'; this.style.transform='translateY(-1px)';" onmouseout="this.style.background='rgba(255, 95, 95, 0.05)'; this.style.borderColor='rgba(255, 95, 95, 0.2)'; this.style.transform='translateY(0)';">Delete</button>
                </div>
              </div>
            `).join('');
          }
        } catch (err) {
          offersList.innerHTML = '<span style="color:#ff5f5f;font-size:12px;">Failed to load offers.</span>';
        }
      }

      // Fetch and render orders
      const ordersList = document.getElementById('ordersList');
      let currentOrderSearch = '';
      const orderSearchInput = document.getElementById('orderSearch');
      if (orderSearchInput) {
        orderSearchInput.addEventListener('input', (e) => {
          currentOrderSearch = e.target.value;
          loadAdminOrders(1);
        });
      }

      async function loadAdminOrders(page = 1) {
        ordersList.innerHTML = '<span style="color:var(--muted);font-size:12px;">Loading...</span>';
        const ordersPagination = document.getElementById('ordersPagination');
        if(ordersPagination) ordersPagination.innerHTML = '';
        
        try {
          const res = await fetch(`../api/get_orders.php?page=${page}&search=${encodeURIComponent(currentOrderSearch)}`);
          const data = await res.json();
          if (data.success) {
            if (data.orders.length === 0) {
              ordersList.innerHTML = '<span style="color:var(--muted);font-size:12px;">No orders yet.</span>';
              return;
            }
            ordersList.innerHTML = data.orders.map(order => {
              // Format date safely for all browsers
              const safeDateStr = order.created_at ? order.created_at.replace(' ', 'T') : '';
              const orderDate = new Date(safeDateStr);
              const formattedDate = orderDate.toLocaleString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                timeZone: 'Asia/Kolkata',
                timeZoneName: 'short'
              });

              return `
              <div class="grid-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:18px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px;">
                  <div style="display:flex; flex-direction:column; gap:4px;">
                    <strong style="color:#fff; font-size:18px; font-weight: 700;">Order #${order.id}</strong>
                    <span style="font-size:12px; color:var(--muted);">${formattedDate}</span>
                  </div>
                  <span style="font: 14px 'DM Mono'; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: 500;">$${order.total_amount}</span>
                </div>
                <div style="font-size:14px; color:rgba(255,255,255,0.9); margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px;">
                  <span style="color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Customer Info</span>
                  <strong>${order.customer_name}</strong>
                  <div style="font-size:12px; color:var(--muted); margin-top:4px;">
                    <a href="mailto:${order.customer_email}?subject=Your%20Order%20from%20Suvarna%20Cinefusion" style="color:var(--lime); text-decoration:none;">${order.customer_email}</a><br>
                    ${order.customer_phone ? `Phone: ${order.customer_phone}<br>` : ''}
                    ${order.transaction_id ? `Txn ID: <strong style="color:#fff;">${order.transaction_id}</strong>` : ''}
                  </div>
                </div>
                <div style="font-size:13px; color:rgba(255,255,255,0.7); flex-grow: 1;">
                  <span style="color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; display: block; margin-bottom: 12px;">Items Purchased</span>
                  <ul style="margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
                    ${(order.items || []).map(item => `
                      <li style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                          ${item.image ? `<img src="../${item.image}" style="width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1);">` : '<div style="width:36px; height:36px; border-radius:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);"></div>'}
                          <span style="font-size: 14px; color: #fff; font-weight: 500;">${item.name || 'Unknown Item'}</span>
                        </div>
                        <span style="font-family: 'DM Mono'; font-weight: 500; color: var(--lime);">$${item.price}</span>
                      </li>
                    `).join('')}
                    ${!(order.items && order.items.length) ? '<li style="color:#ff5f5f; font-size: 12px;">No items found in this order.</li>' : ''}
                  </ul>
                </div>
              </div>
            `;
            }).join('');

            if(ordersPagination && data.totalPages > 1) {
              let paginationHtml = '';
              for(let i = 1; i <= data.totalPages; i++) {
                const isActive = i === data.currentPage ? 'background: var(--lime); color: #17121e; border-color: var(--lime);' : 'background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.1);';
                paginationHtml += `<button onclick="loadAdminOrders(${i})" style="padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; ${isActive} font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;">${i}</button>`;
              }
              ordersPagination.innerHTML = paginationHtml;
            }
          } else {
            ordersList.innerHTML = `<span style="color:#ff5f5f;font-size:12px;">Failed to load orders: ${data.message || 'Unknown error'}</span>`;
          }
        } catch (err) {
          ordersList.innerHTML = '<span style="color:#ff5f5f;font-size:12px;">Failed to load orders.</span>';
        }
      }

      // Handle Edit Click
      window.editOffer = (id) => {
        const offer = currentOffers.find(o => o.id == id);
        if (offer) {
          formTitle.textContent = 'Edit Offer';
          offerIdInput.value = offer.id;
          document.getElementById('title').value = offer.title;
          document.getElementById('type').value = offer.type;
          document.getElementById('price_basic').value = offer.price_basic;
          document.getElementById('price_advanced').value = offer.price_advanced;
          document.getElementById('price_premium').value = offer.price_premium;
          document.getElementById('description').value = offer.description;
          addOfferBtn.innerHTML = 'Save Changes <span>↗</span>';
          cancelEditBtn.style.display = 'block';
          
          // Switch to Add Tab
          const tabAddBtn = document.getElementById('tabAddBtn');
          if (tabAddBtn) window.switchTab('addTab', tabAddBtn);
        }
      };

      // Handle Cancel Edit
      cancelEditBtn.addEventListener('click', () => {
        formTitle.textContent = 'Add New Offer';
        offerIdInput.value = '';
        offerForm.reset();
        addOfferBtn.innerHTML = 'Publish <span>↗</span>';
        cancelEditBtn.style.display = 'none';
      });

      // Handle Delete Click
      window.deleteOffer = async (id) => {
        if (!confirm('Are you sure you want to delete this offer?')) return;
        try {
          const formData = new FormData();
          formData.append('id', id);
          const res = await fetch('../api/delete_offer.php', { method: 'POST', body: formData });
          const data = await res.json();
          if (data.success) {
            loadAdminOffers();
          } else {
            alert(data.message);
          }
        } catch (err) {
          alert('Delete failed.');
        }
      };

      // Handle Login
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginBtn.textContent = 'Verifying...';
        const formData = new FormData(loginForm);
        try {
          const res = await fetch('../api/login.php', { method: 'POST', body: formData });
          const data = await res.json();
          if (data.success) {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            loginForm.reset();
            loadAdminOffers(); // Load offers once logged in
            loadAdminOrders(); // Load orders once logged in
            loadAdminPortfolio(); // Load portfolio once logged in
          } else {
            loginMessage.textContent = data.message;
            loginMessage.style.display = 'block';
            loginMessage.className = 'auth-message';
          }
        } catch (err) {
          loginMessage.textContent = 'Connection error.';
          loginMessage.style.display = 'block';
        }
        loginBtn.innerHTML = 'Secure Login <span>→</span>';
      });

      // Handle Add/Edit Offer Submit
      offerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const isEdit = offerIdInput.value !== '';
        addOfferBtn.textContent = isEdit ? 'Saving...' : 'Publishing...';
        
        const formData = new FormData(offerForm);
        const endpoint = isEdit ? '../api/edit_offer.php' : '../api/add_offer.php';
        
        try {
          const res = await fetch(endpoint, { method: 'POST', body: formData });
          const data = await res.json();
          
          offerMessage.textContent = data.message;
          offerMessage.style.display = 'block';
          
          if (data.success) {
            offerMessage.className = 'auth-message success';
            cancelEditBtn.click(); // Reset form and UI
            loadAdminOffers(); // Refresh list
            setTimeout(() => { offerMessage.style.display = 'none'; }, 3000);
          } else {
            offerMessage.className = 'auth-message';
          }
        } catch (err) {
          offerMessage.textContent = 'Connection error.';
          offerMessage.style.display = 'block';
          offerMessage.className = 'auth-message';
        }
        addOfferBtn.innerHTML = isEdit ? 'Save Changes <span>↗</span>' : 'Publish <span>↗</span>';
      });

      // Fetch and render portfolio
      async function loadAdminPortfolio() {
        portfolioList.innerHTML = '<span style="color:var(--muted);font-size:12px;">Loading...</span>';
        try {
          const res = await fetch('../api/get_portfolio.php');
          const data = await res.json();
          if (data.success) {
            currentPortfolio = data.portfolio;
            if (currentPortfolio.length === 0) {
              portfolioList.innerHTML = '<span style="color:var(--muted);font-size:12px;">No portfolio items available.</span>';
              return;
            }
            portfolioList.innerHTML = currentPortfolio.map(item => {
              const isVideo = item.image_path.match(/\.(mp4|webm|ogg)$/i);
              const mediaContent = isVideo 
                ? `<video src="../${item.image_path}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1);" controls muted></video>`
                : `<img src="../${item.image_path}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1);">`;
              return `
              <div class="grid-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items: flex-start;">
                  <strong style="color:var(--lime); font-size:18px; font-weight: 700; letter-spacing: -0.01em;">${item.title}</strong>
                  <span style="font: 14px 'DM Mono'; background: rgba(206, 255, 26, 0.1); border: 1px solid rgba(206, 255, 26, 0.2); color: var(--lime); padding: 4px 10px; border-radius: 6px; font-weight: 500;">${item.year}</span>
                </div>
                <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 15px; display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; align-self: flex-start;">${item.category}</div>
                <div style="font-size:14px; color:rgba(255,255,255,0.8); line-height:1.6; margin-bottom:25px; flex-grow: 1;">${item.description}</div>
                ${mediaContent}
                <div style="display:flex; gap:10px; margin-top: auto;">
                  <button class="button button-ghost" style="flex:1; padding: 10px; color: #ff5f5f; border-color: rgba(255, 95, 95, 0.2);" onclick="deletePortfolio(${item.id})">Delete</button>
                </div>
              </div>
            `}).join('');
          } else {
            portfolioList.innerHTML = `<span style="color:#ff5f5f;font-size:12px;">Failed to load portfolio: ${data.message}</span>`;
          }
        } catch (err) {
          portfolioList.innerHTML = '<span style="color:#ff5f5f;font-size:12px;">Failed to load portfolio.</span>';
        }
      }

      // Handle Delete Portfolio
      window.deletePortfolio = async (id) => {
        if (!confirm('Are you sure you want to delete this portfolio item?')) return;
        try {
          const res = await fetch('../api/delete_portfolio.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          });
          const data = await res.json();
          if (data.success) {
            loadAdminPortfolio();
          } else {
            alert(data.message);
          }
        } catch (err) {
          alert('Delete failed.');
        }
      };

      // Handle Add Portfolio Submit
      portfolioForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        addPortfolioBtn.textContent = 'Publishing...';
        
        const formData = new FormData(portfolioForm);
        
        try {
          const res = await fetch('../api/add_portfolio.php', { method: 'POST', body: formData });
          const data = await res.json();
          
          portfolioMessage.textContent = data.message;
          portfolioMessage.style.display = 'block';
          
          if (data.success) {
            portfolioMessage.className = 'auth-message success';
            portfolioForm.reset();
            loadAdminPortfolio(); // Refresh list
            setTimeout(() => { portfolioMessage.style.display = 'none'; }, 3000);
          } else {
            portfolioMessage.className = 'auth-message';
          }
        } catch (err) {
          portfolioMessage.textContent = 'Connection error.';
          portfolioMessage.style.display = 'block';
          portfolioMessage.className = 'auth-message';
        }
        addPortfolioBtn.innerHTML = 'Publish <span>↗</span>';
      });

      // Simple logout
      logoutBtn.addEventListener('click', () => {
        window.location.reload(); 
      });
    </script>
    <div class="mobile-nav-overlay">
      <button class="mobile-nav-close" aria-label="Close mobile menu">×</button>
      <nav class="mobile-nav-links">
        <a href="portfolio.html">Portfolio</a>
        <a href="services.html">Services</a>
        
        <a href="about.html">About</a>
      </nav>
    </div>
    <script src="../js/mobile-nav.js"></script>
  </body>
</html>
